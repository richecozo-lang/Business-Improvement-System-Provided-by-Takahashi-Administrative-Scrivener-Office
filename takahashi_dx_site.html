*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy-deep: #0b1628;

html { scroll-behavior: smooth; }

body {

  color: var(--text);
  font-family: var(--ff-body);
  font-size: 15px;
  line-height: 1.8;

/* ─── NAV ─── */
nav {

  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4rem;

  border-bottom: 1px solid rgba(184,150,106,0.15);
}
.nav-logo { display: flex; flex-direction: column; gap: 2px; }
.nav-logo-main { font-family: var(--ff-serif); font-size: 17px; font-weight: 600; color: var(--white); letter-spacing: 0.08em; }
.nav-logo-sub { font-size: 9px; color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; }
.nav-links { display: flex; gap: 2.5rem; align-items: center; }
.nav-links a { font-size: 12px; color: var(--muted); text-decoration: none; transition: color 0.2s; letter-spacing: 0.08em; }

.nav-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.1); }
.nav-cta {

  font-family: var(--ff-body); transition: background 0.2s, color 0.2s;
}
.nav-cta:hover { background: var(--gold); color: var(--navy-deep); }

.hero-content { position: relative; z-index: 1; max-width: 680px; padding-left: 3rem; }
